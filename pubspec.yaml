publish_to: 'none'
version: 6.0.0+15

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  syncfusion_flutter_pdf: ^27.1.58
