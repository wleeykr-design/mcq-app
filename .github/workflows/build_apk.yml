name: Build Batch 27 Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Gradle wrapper if absent
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms android --org com.medquiz --project-name batch27_flutter /tmp/fscaffold
            cp /tmp/fscaffold/android/gradlew android/gradlew
            cp /tmp/fscaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle
            cp -r /tmp/fscaffold/android/gradle/* android/gradle/
            chmod +x android/gradlew
          fi

      - name: Fetch dependencies & analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Batch27 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Batch27-MCQ-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
